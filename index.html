<!doctype html><html lang="pt"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Escolha múltipla de compassos de 4 pulsações em divisão ternária</title><style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#192b3b;background:#eef3f8}*{box-sizing:border-box}body{margin:0;padding:24px 12px}.app{max-width:920px;margin:auto;background:white;border-radius:20px;padding:25px;box-shadow:0 12px 36px #20334b18}h1{text-align:center;margin:0;font-size:clamp(24px,4vw,34px)}.subtitle{text-align:center;color:#66788b;margin:7px 0 22px}.toolbar,.actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:15px 0}button{font:inherit;border:0;border-radius:10px;padding:12px 17px;cursor:pointer;background:#e7eef5;color:#19334a;font-weight:650}button.primary{background:#176cb1;color:white}button:disabled{opacity:.45;cursor:not-allowed}.active{background:#176cb1;color:white}.status{text-align:center;min-height:25px;color:#435c72}.options{display:grid;gap:12px;margin:20px 0}.option{display:flex;align-items:center;gap:15px;width:100%;text-align:left;background:#fafcfe;border:2px solid #dce5ee;border-radius:13px;padding:12px;min-height:104px}.option .letter{background:#e4edf5;display:grid;place-items:center;width:46px;height:46px;flex-shrink:0;border-radius:10px;font-size:21px}.option .cells{display:flex;gap:6px;align-items:center;flex:1;min-width:0}.option img{min-width:0;width:100%;height:95px;object-fit:contain;object-position:center;max-width:100%;background:white;border-radius:5px;padding:3px}.option .cells{gap:8px}.option.selected{border-color:#1671c5;background:#eef6ff}.option.correct{border-color:#16824a;background:#e9f8ee}.option.wrong{border-color:#ca3f43;background:#fff0f0}.option.correct .letter{background:#c8eed5}.option.wrong .letter{background:#ffd1d1}.beatrow{display:flex;justify-content:center;gap:10px;margin:12px}.beat{width:18px;height:18px;border-radius:50%;background:#d5dfe8;transition:background .1s}.beat.on{background:#1388c9;box-shadow:0 0 0 5px #1388c922}.beat.on.first{background:#f0a52c;box-shadow:0 0 0 6px #f0a52c44}.hidden{display:none!important}.review{border-top:1px solid #e2e8f0;margin-top:22px;padding-top:12px}.reviewitem{padding:10px;border-bottom:1px solid #e6edf3}.reviewitem img{max-height:45px;max-width:75px;object-fit:contain;margin:3px}.small{font-size:13px;color:#61748a}#feedback{font-weight:700;text-align:center;min-height:26px}.reviewline{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:4px}@media(max-width:550px){.app{padding:15px}.option{gap:8px;padding:8px;min-height:75px}.option .letter{width:35px;height:35px}.option img{height:62px;padding:1px}.option .cells{gap:2px}button{padding:10px 12px}}
</style></head><body><main class="app"><h1>Escolha múltipla de compassos de 4 pulsações em divisão ternária</h1><p class="subtitle">50 BPM</p><div class="toolbar"><button id="training" class="active">Treino</button><button id="test">Teste (10 exercícios)</button></div><p class="status" id="progress"></p><div class="beatrow" id="beats"><span class="beat first"></span><span class="beat"></span><span class="beat"></span><span class="beat"></span></div><div class="actions"><button class="primary" id="play">▶ Ouvir ditado</button><button id="stop" disabled>■ Parar</button></div><p class="status" id="listens"></p><div class="options" id="options"></div><div class="actions"><button class="primary" id="confirm" disabled>Confirmar resposta</button><button id="next" class="hidden">Novo exercício</button></div><p id="feedback" aria-live="polite"></p><section id="results" class="review hidden"></section><p class="small" style="text-align:center">Seleciona uma opção e confirma a tua resposta. No teste, a correção aparece apenas no final.</p></main>
<script>
const BPM=50, BEAT=60/BPM, letters=['A','B','C','D'];let mode='training',index=0,question=null,selected=null,answered=false,listens=0,records=[],ctx=null,buffers={},sources=[],timers=[],playing=false,run=0;
const $=id=>document.getElementById(id);const rand=n=>Math.floor(Math.random()*n);const eq=(a,b)=>JSON.stringify(a)===JSON.stringify(b);const duration=n=>1;const total=a=>a.length;const shuffle=a=>{let b=[...a];for(let i=b.length-1;i>0;i--){let j=rand(i+1);[b[i],b[j]]=[b[j],b[i]]}return b};
// Nove células, todas de uma pulsação. 2 e 9 proibidas na primeira posição.
function randomBar(){return Array.from({length:4},(_,i)=>{const allowed=Array.from({length:9},(_,j)=>j+1).filter(n=>i!==0||(n!==2&&n!==9));return allowed[rand(allowed.length)]})}
function variations(base){
  // Cada alternativa errada difere da correta em exatamente UMA pulsação.
  const positions=shuffle([0,1,2,3]);
  const chosen=[];
  for(const pos of positions){
    const allowed=Array.from({length:9},(_,j)=>j+1).filter(n=>n!==base[pos]&&(pos!==0||(n!==2&&n!==9)));
    const n=allowed[rand(allowed.length)];
    const bar=[...base];bar[pos]=n;
    chosen.push(bar);
    if(chosen.length===3)break;
  }
  return chosen;
}
function newQuestion(){stop();selected=null;answered=false;listens=0;let correct=randomBar(),choices=shuffle([correct,...variations(correct)]);question={correct,choices,key:choices.findIndex(c=>eq(c,correct))};$('feedback').textContent='';$('results').classList.add('hidden');$('next').classList.add('hidden');$('confirm').disabled=true;render()}
function render(){let isTest=mode==='test';$('progress').textContent=isTest?`Exercício ${index+1} de 10`:'Modo Treino';$('listens').textContent=isTest?`Audições utilizadas: ${listens} de 3`:'Audições ilimitadas';$('play').disabled=playing||(isTest&&listens>=3)||answered;$('stop').disabled=!playing;$('options').innerHTML='';question.choices.forEach((bar,i)=>{let btn=document.createElement('button');btn.className='option';if(selected===i)btn.classList.add('selected');if(answered&&!isTest){if(i===question.key)btn.classList.add('correct');else if(i===selected)btn.classList.add('wrong')}btn.disabled=answered||playing;let lab=document.createElement('span');lab.className='letter';lab.textContent=letters[i];let cells=document.createElement('span');cells.className='cells';bar.forEach(n=>{let im=document.createElement('img');im.src=`imagens/img${n}.png`;im.alt=`Célula rítmica ${n}`;im.style.flex='1 1 0';im.style.width='0';cells.append(im)});btn.append(lab,cells);btn.onclick=()=>{selected=i;$('confirm').disabled=false;render()};$('options').append(btn)});$('confirm').disabled=selected===null||answered||playing}
async function loadAudio(){if(!ctx)ctx=new (window.AudioContext||window.webkitAudioContext)();await ctx.resume();await Promise.all(Array.from({length:9},(_,i)=>i+1).map(async n=>{if(buffers[n])return;let r=await fetch(`sons/som${n}.mp3`);if(!r.ok)throw Error('Ficheiro de áudio não encontrado: som'+n);buffers[n]=await ctx.decodeAudioData(await r.arrayBuffer())}))}
function clearTimers(){timers.forEach(clearTimeout);timers=[];document.querySelectorAll('.beat').forEach(e=>e.classList.remove('on'))}function stop(){run++;sources.forEach(s=>{try{s.stop()}catch(e){}});sources=[];clearTimers();playing=false;if(question)render()}
function schedule(fn,delay){timers.push(setTimeout(fn,Math.max(0,delay)))}function clickAt(t,accent){let osc=ctx.createOscillator(),gain=ctx.createGain();osc.type='sine';osc.frequency.value=accent?1150:850;gain.gain.setValueAtTime(accent?.30:.15,t);gain.gain.exponentialRampToValueAtTime(.001,t+.055);osc.connect(gain).connect(ctx.destination);osc.start(t);osc.stop(t+.06);sources.push(osc)}
async function play(){if(playing||answered||(mode==='test'&&listens>=3))return;playing=true;render();try{await loadAudio()}catch(e){playing=false;render();$('feedback').textContent='Não foi possível carregar os sons. Abre o aplicativo através de um servidor ou do GitHub Pages.';return}if(!playing)return;let token=++run;listens++;let start=ctx.currentTime+.12;for(let p=0;p<8;p++){clickAt(start+p*BEAT,p%4===0);schedule(()=>{if(token!==run)return;let dots=[...document.querySelectorAll('.beat')];dots.forEach(d=>d.classList.remove('on'));dots[p%4].classList.add('on');schedule(()=>dots[p%4].classList.remove('on'),150)},(start+p*BEAT-ctx.currentTime)*1000)}let beat=0;for(let n of question.correct){let src=ctx.createBufferSource(),gain=ctx.createGain(),when=start+(4+beat)*BEAT;src.buffer=buffers[n];gain.gain.value=1;src.connect(gain).connect(ctx.destination);src.start(when);/* O áudio termina naturalmente; não cortar ao fim de uma pulsação. */sources.push(src);beat+=duration(n)}schedule(()=>{if(token!==run)return;playing=false;clearTimers();render()},(start+7*BEAT+Math.max(BEAT,...question.correct.map(n=>buffers[n].duration))-ctx.currentTime)*1000+120);render()}
function confirm(){if(selected===null||answered||playing)return;answered=true;records.push({choices:question.choices.map(x=>[...x]),key:question.key,selected});if(mode==='training'){$('feedback').textContent=selected===question.key?'✓ Resposta correta!':`✗ Resposta incorreta. A opção correta é ${letters[question.key]}.`;$('next').textContent='Novo exercício';$('next').classList.remove('hidden')}else if(index===9){showResults()}else{$('feedback').textContent='Resposta registada. Continua para o próximo exercício.';$('next').textContent='Próximo exercício';$('next').classList.remove('hidden')}render()}
function showResults(){let score=records.filter(r=>r.key===r.selected).length;$('feedback').textContent=`Teste concluído: ${score}/10 respostas corretas`;$('options').classList.add('hidden');$('play').disabled=true;$('confirm').classList.add('hidden');$('next').textContent='Novo teste';$('next').classList.remove('hidden');let section=$('results');section.innerHTML='<h2>Correção do teste</h2>';records.forEach((r,i)=>{let div=document.createElement('div');div.className='reviewitem';let h=document.createElement('div');h.textContent=`Exercício ${i+1}: escolheste ${letters[r.selected]} · correta: ${letters[r.key]} ${r.selected===r.key?'✓':'✗'}`;div.append(h);for(let [label,idx] of [['A tua resposta',r.selected],['Resposta correta',r.key]]){let line=document.createElement('div');line.className='reviewline';let strong=document.createElement('strong');strong.textContent=label+': ';line.append(strong);r.choices[idx].forEach(n=>{let im=document.createElement('img');im.src=`imagens/img${n}.png`;im.alt=`Célula ${n}`;line.append(im)});div.append(line)}section.append(div)});section.classList.remove('hidden')}
function reset(m){stop();mode=m;index=0;records=[];$('options').classList.remove('hidden');$('confirm').classList.remove('hidden');$('training').classList.toggle('active',m==='training');$('test').classList.toggle('active',m==='test');newQuestion()}
$('training').onclick=()=>reset('training');$('test').onclick=()=>reset('test');$('play').onclick=play;$('stop').onclick=stop;$('confirm').onclick=confirm;$('next').onclick=()=>{if(mode==='test'&&index===9){reset('test')}else{if(mode==='test')index++;newQuestion()}};newQuestion();
</script></body></html>
